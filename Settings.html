<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Centralized Settings - SecureVPN Hub</title>
  <link rel="stylesheet" href="css style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body data-module="settings">

  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">SecureVPN Hub</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="vpn.html">VPN Connections</a>
        <a href="devices.html">Devices</a>
        <a href="users.html">Users & RBAC</a>
        <a href="policies.html">Policies</a>
        <a href="monitoring.html">Monitoring</a>
        <a href="modules.html">Modules</a>
        <a href="reports.html">Reports</a>
        <a href="audit.html">Audit Logs</a>
        <a href="settings.html" class="active">Settings</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="navbar">
        <span>EMS Server & Global Configurations (Database Connected)</span>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span style="font-size: 0.875rem; font-weight: 500; color: var(--text-muted, #64748b);">User: <strong style="color: var(--text-main, #1e293b);">Administrator</strong></span>
          <button onclick="handleLogout()" 
                  onmouseover="this.style.background='#dc2626'; this.style.color='#ffffff'; this.style.transform='translateY(-1px)';" 
                  onmouseout="this.style.background='#fee2e2'; this.style.color='#dc2626'; this.style.transform='translateY(0)';"
                  style="background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 0.4rem 0.9rem; border-radius: 6px; font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.35rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <span>Sign Out</span>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">Centralized Management Settings</h1>
          <button class="btn btn-primary" onclick="saveGlobalSettings()">Save & Synchronize Policies</button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 900px;">
          
          <div class="card" style="padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem; font-size: 1.125rem; font-weight: 600;">Cloud EMS Synchronization Server</h3>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                <label style="font-size: 0.875rem; font-weight: 500;">EMS Server Host / FQDN</label>
                <input type="text" id="emsHost" style="padding: 0.625rem 0.875rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none; font-size: 0.875rem;">
              </div>
              <div style="display: flex; flex-direction: column; gap: 0.375rem;">
                <label style="font-size: 0.875rem; font-weight: 500;">Heartbeat Interval (Seconds)</label>
                <input type="number" id="heartbeat" style="padding: 0.625rem 0.875rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none; font-size: 0.875rem;">
              </div>
            </div>
          </div>

          <div class="card" style="padding: 1.5rem;">
            <h3 style="margin-bottom: 1rem; font-size: 1.125rem; font-weight: 600;">Access Control & Security Policies</h3>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
              <label style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; cursor: pointer;">
                <input type="checkbox" id="enforceMfa" style="width: 1rem; height: 1rem; accent-color: var(--primary);">
                <span>Enforce Multi-Factor Authentication (MFA) across all remote endpoints</span>
              </label>
              <label style="display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; cursor: pointer;">
                <input type="checkbox" id="blockUnmanaged" style="width: 1rem; height: 1rem; accent-color: var(--primary);">
                <span>Automatically block uncoordinated personal VPN accounts and unverified devices</span>
              </label>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script>
    async function loadSettings() {
      try {
        const res = await fetch('http://localhost:3000/api/settings');
        const data = await res.json();
        if(data.emsHost) document.getElementById('emsHost').value = data.emsHost;
        if(data.heartbeat) document.getElementById('heartbeat').value = data.heartbeat;
        if(data.enforceMfa) document.getElementById('enforceMfa').checked = data.enforceMfa === 'true';
        if(data.blockUnmanaged) document.getElementById('blockUnmanaged').checked = data.blockUnmanaged === 'true';
      } catch (err) {
        console.error('Failed to load settings:', err);
      }
    }

    async function saveGlobalSettings() {
      const payload = {
        emsHost: document.getElementById('emsHost').value,
        heartbeat: document.getElementById('heartbeat').value,
        enforceMfa: String(document.getElementById('enforceMfa').checked),
        blockUnmanaged: String(document.getElementById('blockUnmanaged').checked)
      };

      await fetch('http://localhost:3000/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      alert("Centralized policies successfully saved to database and pushed to all active endpoints.");
    }

    function handleLogout() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }

    window.onload = loadSettings;
  </script>
</body>
</html>
