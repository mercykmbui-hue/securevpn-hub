<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Management - SecureVPN Hub</title>
  <link rel="stylesheet" href="css style.css">
  <script>
    if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
</head>
<body data-module="users">
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">SecureVPN Hub</div>
      <nav class="sidebar-nav">
        <a href="dashboard.html">Dashboard</a>
        <a href="vpn.html">VPN Connections</a>
        <a href="devices.html">Devices</a>
        <a href="users.html" class="active">Users & RBAC</a>
        <a href="policies.html">Policies</a>
        <a href="monitoring.html">Monitoring</a>
        <a href="modules.html">Modules</a>
        <a href="reports.html">Reports</a>
        <a href="audit.html">Audit Logs</a>
        <a href="settings.html">Settings</a>
      </nav>
    </aside>

    <div class="main-wrapper">
      <header class="navbar">
        <span>User Directory & RBAC (Database Connected)</span>
        <div style="display: flex; align-items: center; gap: 1rem;">
          <span style="font-size: 0.875rem; font-weight: 500; color: var(--text-muted, #64748b);">Role: <strong style="color: var(--text-main, #1e293b);">Super Administrator</strong></span>
          <button onclick="handleLogout()" 
                  onmouseover="this.style.background='#dc2626'; this.style.color='#ffffff'; this.style.transform='translateY(-1px)';" 
                  onmouseout="this.style.background='#fee2e2'; this.style.color='#dc2626'; this.style.transform='translateY(0)';"
                  style="background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; padding: 0.4rem 0.9rem; border-radius: 6px; font-size: 0.8125rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; gap: 0.35rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <span>Sign Out</span>
          </button>
        </div>
      </header>

      <main class="content">
        <div class="page-header">
          <h1 class="page-title">User Management</h1>
          <button class="btn btn-primary" onclick="openModal('addUserModal')">+ Add New User</button>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Department</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="user-table-body"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <div id="addUserModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.5); align-items:center; justify-content:center;">
    <div class="modal-content" style="background:var(--bg-surface); padding:1.5rem; border-radius:var(--radius); width:400px;">
      <h2 style="margin-bottom: 1rem; font-size: 1.25rem;">Provision New User Account</h2>
      <form id="userForm" onsubmit="handleUserSubmit(event)">
        <div style="display: flex; flex-direction: column; gap: 0.75rem;">
          <label style="font-size: 0.875rem; font-weight: 500;">Username</label>
          <input type="text" id="modalUsername" required style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none;">

          <label style="font-size: 0.875rem; font-weight: 500;">Email Address</label>
          <input type="email" id="modalEmail" required style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none;">

          <label style="font-size: 0.875rem; font-weight: 500;">Department</label>
          <input type="text" id="modalDept" required style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none;">

          <label style="font-size: 0.875rem; font-weight: 500;">Administrator Role</label>
          <select id="modalRole" style="padding: 0.5rem; border: 1px solid var(--border-color); border-radius: var(--radius); outline: none; background: var(--bg-surface);">
            <option value="Standard User">Standard User</option>
            <option value="Security Admin">Security Admin</option>
            <option value="Super Admin">Super Admin</option>
          </select>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1.5rem;">
          <button type="button" class="btn" onclick="closeModal('addUserModal')" style="background: var(--border-color);">Cancel</button>
          <button type="submit" class="btn btn-primary">Save to Database</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/api/users';

    async function loadUsers() {
      const res = await fetch(API_URL);
      const data = await res.json();
      const tbody = document.getElementById('user-table-body');
      tbody.innerHTML = '';

      if(!data.users || data.users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 1rem;">No users found.</td></tr>`;
        return;
      }

      data.users.forEach(user => {
        const isActive = user.status === 'Active';
        const badgeClass = isActive ? 'badge-success' : 'badge-danger';
        const btnText = isActive ? 'Disable' : 'Enable';

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${user.username}</strong></td>
          <td>${user.email}</td>
          <td>${user.department}</td>
          <td><span class="badge badge-success">${user.role}</span></td>
          <td><span class="badge ${badgeClass}">${user.status}</span></td>
          <td>
            <div style="display: flex; gap: 0.35rem; align-items: center;">
              <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; background: var(--warning-bg); color: var(--warning);" onclick="toggleStatus(${user.id}, '${user.status}')">${btnText}</button>
              <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; background: var(--danger-bg); color: var(--danger);" onclick="deleteUser(${user.id}, '${user.username}')">Delete</button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; document.getElementById('userForm').reset(); }

    async function handleUserSubmit(e) {
      e.preventDefault();
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('modalUsername').value,
          email: document.getElementById('modalEmail').value,
          department: document.getElementById('modalDept').value,
          role: document.getElementById('modalRole').value
        })
      });
      closeModal('addUserModal');
      loadUsers();
    }

    async function toggleStatus(id, currentStatus) {
      const newStatus = currentStatus === 'Active' ? 'Disabled' : 'Active';
      await fetch(`${API_URL}/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      loadUsers();
    }

    async function deleteUser(id, username) {
      if (confirm(`Are you sure you want to delete user "${username}" from the database?`)) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        loadUsers();
      }
    }

    function handleLogout() {
      localStorage.removeItem('isAdminLoggedIn');
      window.location.href = 'login.html';
    }

    window.onload = loadUsers;
  </script>
</body>
</html>
